[project]
name = "sharp-eyes"
version = "0.1.0"
description = "Sharp bettor discovery and cross-venue copy-trading research platform (paper mode only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pyyaml==6.0.2",
    "sqlalchemy==2.0.36",
]

[project.scripts]
sharp-eyes = "sharp_eyes.cli:main"

[dependency-groups]
dev = [
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.6",
    "types-pyyaml==6.0.12.20241230",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharp_eyes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "E501"]
# SQL text there only interpolates the fixed schema name constant.
"src/sharp_eyes/capture/**" = ["S608"]
"src/sharp_eyes/copyability/store.py" = ["S608"]
"src/sharp_eyes/cli.py" = ["S608"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a PostgreSQL database (SHARP_EYES_DATABASE_URL)",
    "live: calls the real venue APIs (opt in with -m live)",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
