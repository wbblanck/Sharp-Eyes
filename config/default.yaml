# Sharp-Eyes default configuration (spec v3.0, section 11.1).
# These are starting engineering defaults, not validated optimal values.
# Secrets (database URL, venue credentials) are never stored here; they come from
# environment variables. See .env.example.

execution:
  mode: paper
  live_orders_enabled: false

paper:
  stake_mode: fixed_usd          # fixed_usd | fixed_units
  fixed_stake_usd: "10.00"
  unit_value_usd: "10.00"
  units_per_signal: "1.0"
  bankroll_usd: "1000.00"
  execution_mode: delayed_quote  # immediate_indicative | delayed_quote | depth_aware

risk:
  min_net_ev: "0.01"
  max_signal_age_seconds: 30
  require_exact_contract_match: true
  max_per_event_exposure_usd: "30.00"
  max_per_trader_exposure_usd: "50.00"
  max_total_open_exposure_usd: "500.00"

qualification:
  # Initial research filter only; crossing it never qualifies a trader by itself.
  min_settled_wagers: 200
  min_distinct_events: 30

cadence_seconds:
  polymarket_trade_ingestion: 10
  market_catalog_refresh: 300
  qualification_recalc: 1800
  settlement_polling: 600
  health_check: 60

# Phase 0 data capture (audit recommendation 6). Book polling slows down the
# further a game is from kickoff; games stay captured through the end of play.
capture:
  window_past_hours: 6
  window_future_days: 8
  catalog_seconds: 300
  tiers:
    - {within_minutes: 180, books_seconds: 15}
    - {within_minutes: 2160, books_seconds: 60}
  cold_books_seconds: 600
  polymarket:
    rate_per_second: 4          # Gamma catalog
    clob_rate_per_second: 10    # CLOB books, 500 tokens per request
    data_rate_per_second: 10    # Data API: documented limit 300 requests / 10 s
    book_scope: game
    trades_seconds: 2           # Fast polling doubles as the latency measurement
    status_seconds: 10
    trade_overlap_seconds: 600  # Re-read window; fills showed up to ~2 min late in testing
    backfill_history: true
  polymarket_us:
    rate_per_second: 10         # Documented limit 25 requests / s per IP
    concurrency: 8
    book_scope: core
  kalshi:
    rate_per_second: 4
    book_scope: core
    trades_seconds: 30
    series: [KXNFLGAME, KXNFLSPREAD, KXNFLTOTAL, KXNFLTEAMTOTAL]
  novig:
    rate_per_second: 2          # Unsigned public routes share a per-IP throttle; keep this low
    book_scope: core
    trades_seconds: 60
    max_levels: 20              # The public book returns at most 20 levels
    market_types: [MONEY, SPREAD, TOTAL, TEAM_TOTAL, SPREAD_1H, TOTAL_1H]
